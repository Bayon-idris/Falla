name: Falla
description: "Find Everyone on the map."
publish_to: 'none'  

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.13.1
  rename_app: ^1.6.6
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: false
  ios: true
  image_path_ios: "assets/logos/icon_ios_flat.png"
  remove_alpha_ios: false

flutter_native_splash:
  color: "#06182b"
  image: assets/logos/app_logo_no_bg.png

  color_dark: "#06182b"
  image_dark: assets/logos/app_logo_no_bg.png

  android_12:
    color: "#06182b"
    image: assets/logos/app_logo_no_bg.png
    color_dark: "#06182b"
    image_dark: assets/logos/app_logo_no_bg.png

  android: true
  ios: true
  web: false
  fullscreen: true


flutter:
  uses-material-design: true

name: falla
description: "Find Everyone on the map."
publish_to: 'none'  

version: 1.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  app_links: ^7.0.0
  firebase_analytics: ^12.4.1 
  firebase_core: ^4.9.0
  firebase_crashlytics: ^5.2.2
  firebase_messaging: ^16.2.2
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_inappwebview: 6.2.0-beta.3
  flutter_secure_storage: ^10.2.0
  http: ^1.6.0
  local_auth: ^3.0.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  rate_my_app: ^2.4.0
  share_plus: ^13.1.0
  shared_preferences: ^2.5.5
  shared_preferences_android: ^2.4.23
  url_launcher: ^6.3.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.13.1
  rename_app: ^1.6.6
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: false
  ios: true
  image_path_ios: "assets/logos/icon_ios_flat.png"
  remove_alpha_ios: false

flutter_native_splash:
  color: "#06182b"
  image: assets/logos/app_logo_no_bg.png

  color_dark: "#06182b"
  image_dark: assets/logos/app_logo_no_bg.png

  android_12:
    color: "#06182b"
    image: assets/logos/app_logo_no_bg.png
    color_dark: "#06182b"
    image_dark: assets/logos/app_logo_no_bg.png

  android: true
  ios: true
  web: false
  fullscreen: true


flutter:
  uses-material-design: true
